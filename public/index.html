<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ToDo CRUD APP</title>
  <script src="script.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #020617;
      border-radius: 16px;
      padding: 24px 24px 32px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.8);
      border: 1px solid #1e293b;
    }

    h1 {
      margin: 0 0 8px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.8fr);
      gap: 24px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 16px 18px 18px;
      border: 1px solid #1f2937;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1rem;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.8rem;
      color: #9ca3af;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: 1px solid #3b82f6;
      border-color: #3b82f6;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > div {
      flex: 1;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      border-radius: 999px;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #22c55e);
      color: #0b1120;
      font-weight: 600;
    }

    .btn-secondary {
      background: #0b1120;
      color: #cbd5f5;
      border: 1px solid #1e293b;
    }

    .btn-danger {
      background: #7f1d1d;
      color: #fee2e2;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .filter-btn {
      flex: 1;
      background: #020617;
      border: 1px solid #1e293b;
      color: #9ca3af;
      border-radius: 999px;
      padding: 6px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111827;
      color: #e5e7eb;
      border-color: #3b82f6;
    }

    ul#tasks {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
    }

    .task {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #020617;
      border: 1px solid #1e293b;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .task-title {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .task-title.done {
      text-decoration: line-through;
      color: #64748b;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .chip {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: #020617;
    }

    .chip-prio-1 { border-color: #22c55e; color: #bbf7d0; }
    .chip-prio-2 { border-color: #4ade80; color: #dcfce7; }
    .chip-prio-3 { border-color: #e5e7eb; color: #e5e7eb; }
    .chip-prio-4 { border-color: #f97316; color: #fed7aa; }
    .chip-prio-5 { border-color: #ef4444; color: #fee2e2; }

    .task-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .badge-done {
      color: #22c55e;
    }
    .badge-pending {
      color: #f97316;
    }

    .empty {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Task Manager</h1>
    <p class="subtitle">
      Mini-aplikacja CRUD – Node.js + SQLite + REST API + SPA.
    </p>

    <div class="layout">
      <section class="card">
        <h2>Nowe / Edytuj zadanie</h2>
        <form id="taskForm" onsubmit="event.preventDefault(); saveTask();">
          <input type="hidden" id="taskId">

          <div>
            <label for="title">Tytuł</label>
            <input id="title" placeholder="Np. Oddać projekt" required>
          </div>

         <div>
          <label for="description">Opis_66675</label>
           <input id="description" placeholder="Krótki opis">
         </div>

          <div class="row">
            <div>
              <label for="priority">Priorytet (1–5)</label>
              <input id="priority" type="number" min="1" max="5" value="3">
            </div>
            <div>
              <label for="deadline">Deadline</label>
              <input id="deadline" type="date">
            </div>
          </div>

          <div>
            <label>
              <input type="checkbox" id="done">
              Oznacz jako ukończone
            </label>
          </div>

          <div class="actions">
            <button type="submit" class="btn-primary"> Zapisz</button>
            <button type="button" class="btn-secondary" onclick="clearForm()">✖ Wyczyść</button>
          </div>
        </form>
      </section>
      <section class="card">
        <h2>
          Lista zadań
          <span id="taskCount" style="font-size:0.8rem;color:#6b7280;"></span>
        </h2>

        <div class="filters">
          <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">
            Wszystkie
          </button>
          <button class="filter-btn" id="filter-active" onclick="setFilter('active')">
            Aktywne
          </button>
          <button class="filter-btn" id="filter-done" onclick="setFilter('done')">
            Ukończone
          </button>
        </div>

        <ul id="tasks"></ul>
        <div id="emptyState" class="empty" style="display:none;">
          Brak zadań do wyświetlenia. Dodaj coś po lewej 
        </div>
      </section>
    </div>
  </div>
</body>
</html>
