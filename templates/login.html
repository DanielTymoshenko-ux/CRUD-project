<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>ToDo App</h1>
  </header>
  <main>
    <h2>Login</h2>
    <form method="post" novalidate onsubmit="return clientLoginValidate(this)">
      <input type="text" name="login" placeholder="Login" required minlength="3" maxlength="50">
      <input type="password" name="password" placeholder="Password" required minlength="6">
      <button type="submit">Login</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <p>No account? <a href="/register">SignUp</a></p>
  </main>

<script>
function clientLoginValidate(form){
  if(form.login.value.trim().length < 3){ alert("Login too short"); return false; }
  return true;
}
</script>
</body>
</html>
