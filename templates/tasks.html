<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Tasks</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Your Tasks</h1>
    <nav>
      <span>Logged in as <b>{{ user }}</b></span>
      <a href="/rates">Rates</a>
      <a href="/weather">Weather</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Add new task</h2>
    <div class="task-form">
      <input id="title" placeholder="Title" minlength="3" maxlength="50" />
      <input id="category" placeholder="Category" maxlength="50" />
      <input type="number" id="priority" placeholder="Priority (1–5)" min="1" max="5" value="3">
      <input id="deadline" type="date" />
      <button id="addBtn">Add</button>
    </div>
    <div id="taskErrors" class="error" style="display:none;"></div>

    <h2>Task List</h2>
    <ul id="taskList">
      {% for t in tasks %}
        <li>
          <div class="task-info">
            <strong>{{ t.title }}</strong>
            <span>{{ t.category or "-" }}</span>
            <span>{{ t.priority or "-" }}</span>
            <span>{{ t.deadline or "-" }}</span>
          </div>
          <div>
            <button onclick="updateTask({{t.id}})">Edit</button>
            <button onclick="deleteTask({{t.id}})">Remove</button>
          </div>
        </li>
      {% else %}
        <li>No tasks</li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
