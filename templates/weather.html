<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Weather</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/script.js" defer></script>
</head>
<body>
<header>
  <h1>Weather</h1>
  <nav>
    <a href="/">Home</a>
    <a href="/tasks">My tasks</a>
  </nav>
</header>

<main>
  <h2>Check weather</h2>
  <div class="task-form">
    <input id="cityInput" placeholder="City (e.g. Warsaw)" />
    <button id="fetchWeatherBtn">Pobierz pogodę</button>
  </div>
  <div id="weatherLoading" style="display:none;">Ładowanie…</div>
  <div id="weatherError" class="error" style="display:none;"></div>
  <div id="weatherResult" style="display:none;">
    <h3>Forecast</h3>
    <div id="weatherList"></div>
  </div>
</main>
</body>
</html>
